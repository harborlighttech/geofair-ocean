<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      {%- if site.logo and site.logo != "" -%}
      <img class="site-brand__logo" src="{{ site.logo | relative_url }}" alt="">
      {%- endif -%}
      <span class="site-brand__title">{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <button class="site-nav__toggle" type="button" aria-expanded="false" aria-controls="site-nav-list" hidden>Menu</button>
      <ul id="site-nav-list" class="site-nav__list">
        {%- for item in site.nav %}
        {%- assign active = "" -%}
        {%- if page.url == item.url or page.url contains item.url and item.url != "/" %}{% assign active = " is-active" %}{% endif %}
        <li><a class="site-nav__link{{ active }}" href="{{ item.url | relative_url }}"{% if active != "" %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
