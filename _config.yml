# ---------------------------------------------------------------------------
# GeoFAIR Resource Hub — site configuration
#
# Everything an implementing domain needs to change is in the first block.
# ---------------------------------------------------------------------------

# --- Domain identity --------------------------------------------------------
title: "GeoFAIR Ocean Resource Hub"
domain: "Ocean"
tagline: "Training and learning resources for FAIR ocean data, across the research data lifecycle."
description: "A curated, searchable catalogue of learning resources for managing, sharing and reusing ocean science data."
organization: "GeoFAIR"
organization_url: "https://example.org/geofair"       # TODO
contact_email: ""                                      # optional; shown in footer when set

# Published site location. For a project site this is
#   url: https://<org>.github.io   baseurl: /<repo>
# For a user/organisation site or a custom domain, baseurl is "".
url: "https://harborlighttech.github.io"
baseurl: "/geofair-ocean"
github_repo: "https://github.com/harborlighttech/geofair-ocean"

# --- Colour scheme ----------------------------------------------------------
# Each value becomes a CSS custom property (--c-<key>) in <head>, so the whole
# site restyles from here. Defaults follow the AGU brand (primary #244C5A,
# secondary #007DBA on white). Keep text on background at 4.5:1 or better.
theme_colors:
  primary: "#244C5A"      # headings, primary buttons, rules under the masthead and above the footer
  primary_text: "#ffffff" # text on primary
  accent: "#007DBA"       # links, hover underlines, active facet chips, focus rings
  accent_bg: "#E4F2FA"    # tint behind accent-marked items
  background: "#ffffff"
  surface: "#F5F7F8"      # cards, facet panel, footer
  text: "#244C5A"
  muted: "#587380"        # secondary text, labels
  muted_2: "#5E7682"      # tertiary text, uppercase section labels
  border: "#D5DFE3"       # rules and card borders
  border_soft: "#E8EEF0"  # lighter rules inside lists
  link: "#007DBA"
  success: "#0B6B4F"
  warning: "#8C6410"
  danger: "#A24B2E"

# --- Typography -------------------------------------------------------------
# display: headings, labels, navigation, buttons. body: running prose.
# google_fonts_url loads the web fonts; set it to "" to use only system fonts
# (the stacks below fall back to Helvetica/Arial and Georgia).
fonts:
  display: "'Montserrat', 'Helvetica Neue', Arial, sans-serif"
  body: "'Lora', Georgia, 'Times New Roman', serif"
  google_fonts_url: "https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap"

# --- Logo (optional) --------------------------------------------------------
# Shown in the header immediately before the site title. Either a path inside
# the site (e.g. assets/img/logo.png) or an absolute https:// URL. Leave empty
# and nothing is rendered in that space.
logo: ""
logo_alt: ""             # accessible name for the logo; leave empty if the title already says it
logo_height: 38          # rendered height in px (width scales)

# Optional hero image for the home page (path under assets/ or an absolute URL)
hero_image: ""
hero_credit: ""

# --- Navigation -------------------------------------------------------------
nav:
  - title: "Resources"
    url: /resources/
  - title: "Vocabularies"
    url: /vocab/
  - title: "Contribute"
    url: /contribute/
  - title: "About"
    url: /about/

footer_links:
  - title: "GitHub"
    url: "https://github.com/harborlighttech/geofair-ocean"
  - title: "Suggest a resource"
    url: "https://github.com/harborlighttech/geofair-ocean/issues/new?template=new-resource.yml"

# --- Catalogue behaviour ----------------------------------------------------
catalogue:
  # Which statuses appear in the public search index. draft and in-review never do.
  indexed_statuses: [published, obsolete]
  # Facets shown on the search page, in order. Remove any you do not want.
  facets: [lifecycle_stage, resource_type, object_type, research_area, expertise_level, audience, access_cost]
  # Profile the JSON-LD declares conformance to
  conforms_to: "https://bioschemas.org/profiles/TrainingMaterial/1.0-RELEASE"
  # Shown on the home page
  recent_count: 5

# ---------------------------------------------------------------------------
# Below here: build settings. Rarely needs changes.
# ---------------------------------------------------------------------------
collections:
  resources:
    output: true
    permalink: /resources/:name/

defaults:
  - scope: {path: "", type: "resources"}
    values:
      layout: resource
      status: draft          # a file that forgets status is never published
      language: en
      access_cost: "no"
  - scope: {path: ""}
    values:
      layout: default

markdown: kramdown
kramdown:
  input: GFM
permalink: pretty
timezone: UTC
strict_front_matter: true

plugins: []                 # no gem plugins; _plugins/resource_alias.rb is a local generator (needs a non --safe build)

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts
  - schema
  - README.md
  - CONTRIBUTING.md
  - GETTING-STARTED.md
  - docs
  - LICENSE
  - requirements.txt
  - .github
