# GENERATED by scripts/build_issue_form.py from _data/vocab/*.yml — do not edit by hand.
name: Suggest a resource
description: Propose a learning resource for the GeoFAIR Ocean Resource Hub.
title: '[resource] <title of the resource>'
labels:
- new-resource
body:
- type: markdown
  attributes:
    value: Thanks for suggesting a resource. Fields marked required must be filled; everything else helps people find and
      judge the resource. A maintainer will review and may edit before publishing.
- type: input
  id: title
  attributes:
    label: Title
    description: As it appears on the resource itself.
  validations:
    required: true
- type: input
  id: resource_url
  attributes:
    label: URL
    description: Landing page or persistent identifier (DOI/handle preferred).
    placeholder: https://
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Description
    description: What it covers, how long it takes, what the learner needs first. 40–2000 characters, plain text.
  validations:
    required: true
- type: dropdown
  id: resource_type
  attributes:
    label: Resource type
    options:
    - Tutorial [tutorial]
    - Online course [online-course]
    - Recorded lecture or webinar [recorded-lecture]
    - Video [video]
    - Slide deck [slide-deck]
    - Guide or handbook [guide]
    - Template or checklist [template]
    - Computational notebook [notebook]
    - Interactive tool [interactive-tool]
    - Reference material [reference]
  validations:
    required: true
- type: dropdown
  id: license
  attributes:
    label: Licence
    options:
    - CC0-1.0 — Creative Commons Zero v1.0 Universal
    - CC-BY-4.0 — Creative Commons Attribution 4.0 International
    - CC-BY-SA-4.0 — Creative Commons Attribution Share Alike 4.0 International
    - CC-BY-NC-4.0 — Creative Commons Attribution Non Commercial 4.0 International
    - CC-BY-NC-SA-4.0 — Creative Commons Attribution Non Commercial Share Alike 4.0 International
    - MIT — MIT License
    - Apache-2.0 — Apache License 2.0
    - GPL-3.0-or-later — GNU General Public License v3.0 or later
    - BSD-3-Clause — BSD 3-Clause License
    - US-Government-Work — US Government Work (public domain in the United States)
    - LicenseRef-Unknown — Licence not stated by the provider
  validations:
    required: true
- type: input
  id: version_date
  attributes:
    label: Version date
    description: Date of the current version of the resource, YYYY-MM-DD.
    placeholder: '2025-01-31'
  validations:
    required: true
- type: checkboxes
  id: lifecycle_stages
  attributes:
    label: Lifecycle stages
    description: Tick every stage the resource teaches (at least one).
    options:
    - label: Plan [plan]
    - label: Collect [collect]
    - label: Process [process]
    - label: Analyse [analyse]
    - label: Preserve [preserve]
    - label: Share [share]
    - label: Reuse [reuse]
    - label: Describe [describe]
- type: checkboxes
  id: research_areas
  attributes:
    label: Research areas
    description: Tick every topic the resource is about (at least one).
    options:
    - label: Bathymetry and seafloor topography [bathymetry-seafloor-topography]
    - label: Coastal processes [coastal-processes]
    - label: Marine geophysics [marine-geophysics]
    - label: Marine sediments [marine-sediments]
    - label: Ocean acoustics [ocean-acoustics]
    - label: Ocean chemistry [ocean-chemistry]
    - label: Ocean circulation [ocean-circulation]
    - label: Ocean heat budget [ocean-heat-budget]
    - label: Ocean optics [ocean-optics]
    - label: Ocean temperature [ocean-temperature]
    - label: Ocean waves [ocean-waves]
    - label: Ocean winds [ocean-winds]
    - label: Salinity and density [salinity-density]
    - label: Sea ice [sea-ice]
    - label: Sea surface topography [sea-surface-topography]
    - label: Tides [tides]
    - label: Water quality [water-quality]
    - label: Marine ecosystems and biology [marine-ecosystems]
    - label: Ocean observing systems [ocean-observing-systems]
    - label: Research data management (cross-cutting) [research-data-management]
- type: checkboxes
  id: audience
  attributes:
    label: Audience
    options:
    - label: Researcher [researcher]
    - label: Data steward or data manager [data-steward]
    - label: Student [student]
    - label: Educator or trainer [educator]
    - label: Repository or infrastructure staff [infrastructure-staff]
    - label: Policy maker or funder [policy-maker]
- type: dropdown
  id: expertise_level
  attributes:
    label: Expertise level
    options:
    - Beginner [beginner]
    - Intermediate [intermediate]
    - Advanced [advanced]
- type: dropdown
  id: access_cost
  attributes:
    label: Does the resource cost money?
    options:
    - 'no'
    - 'yes'
    - maybe (explain in the description)
- type: dropdown
  id: language
  attributes:
    label: Primary language
    options:
    - en
    - es
    - fr
    - de
    - pt
    - it
    - nl
    - ja
    - zh
    - other (say which in the description)
- type: textarea
  id: authors
  attributes:
    label: Authors
    description: 'One per line: Name | Person or Organization | ORCID or ROR URL (optional) | affiliation (optional)'
    placeholder: Jane Doe | Person | https://orcid.org/0000-0000-0000-0000 | Example University
- type: textarea
  id: learning_outcomes
  attributes:
    label: Learning outcomes
    description: 'One per line: what a learner can do after using it.'
- type: input
  id: keywords
  attributes:
    label: Keywords
    description: Comma-separated.
- type: textarea
  id: testimonials
  attributes:
    label: Testimonials
    description: 'One per line: Provider name | Person or Organization | affiliation (optional) | the testimonial text'
- type: textarea
  id: notes
  attributes:
    label: Notes for the page
    description: Optional longer notes (prerequisites, how to use it). Markdown allowed.
